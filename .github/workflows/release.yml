name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Validate vYYYY.M.D tag pattern
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::Release tags must match vYYYY.M.D, for example v2026.4.9."
            exit 1
          fi

          repo_lower="$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repo_lower" >> "$GITHUB_OUTPUT"

  assets:
    name: Build release assets
    runs-on: ubuntu-latest
    needs: validate-tag
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test

      - name: Build release artifacts
        run: zig build -Doptimize=ReleaseSafe

      - name: Package release bundles
        env:
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p dist

          web_bundle="zt-ui-${TAG}-web"
          web_stage="dist/$web_bundle"
          mkdir -p "$web_stage"
          cp -R web "$web_stage/"
          cp README.md LICENSE "$web_stage/"
          tar -C dist -czf "dist/${web_bundle}.tar.gz" "$web_bundle"
          (
            cd dist
            zip -qr "${web_bundle}.zip" "$web_bundle"
          )

          linux_bundle="zt-ui-${TAG}-linux-amd64"
          linux_stage="dist/$linux_bundle"
          mkdir -p "$linux_stage/web"
          cp zig-out/bin/zt-ui-serve "$linux_stage/"
          cp -R web/. "$linux_stage/web/"
          cp README.md LICENSE "$linux_stage/"
          tar -C dist -czf "dist/${linux_bundle}.tar.gz" "$linux_bundle"

      - name: Upload packaged assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: validate-tag
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain-password"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -F "$APPLE_SIGNING_IDENTITY"
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application:"*) ;;
            *)
              echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application certificate. Apple Distribution is for the Mac App Store and cannot be notarized."
              exit 1
              ;;
          esac

      - name: Build universal macOS app
        env:
          ZT_UI_UNIVERSAL: "1"
          ZT_UI_VERSION: ${{ needs.validate-tag.outputs.version }}
          ZT_UI_MACOS_ZIP: dist/zt-ui-${{ needs.validate-tag.outputs.tag }}-macos.zip
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/build-macos-app.sh

      - name: Notarize and staple
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ZT_UI_MACOS_ZIP: dist/zt-ui-${{ needs.validate-tag.outputs.tag }}-macos.zip
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY" | sed 's/\\n/\n/g' > "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            base64 -D -i "$KEY_PATH" -o "$KEY_PATH.decoded"
            mv "$KEY_PATH.decoded" "$KEY_PATH"
          fi
          APP="dist/macos-app/zt-ui Desktop.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/zt-ui-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/zt-ui-notarize.zip" --wait --output-format json \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" > "$RUNNER_TEMP/notarize-result.json"
          SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notarize-result.json")"
          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notarize-result.json")"
          if [[ "$STATUS" != "Accepted" ]]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" || true
            echo "::error::Notarization status is ${STATUS} for ${SUBMISSION_ID}"
            exit 1
          fi
          xcrun stapler staple "$APP"
          rm -f "$ZT_UI_MACOS_ZIP"
          ditto -c -k --keepParent "$APP" "$ZT_UI_MACOS_ZIP"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/keychain-password" "$RUNNER_TEMP/zt-ui-notarize.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/zt-ui-*-macos.zip
          if-no-files-found: error

  macos-mlx:
    name: Build macOS MLX app
    runs-on: macos-latest
    needs: validate-tag
    permissions:
      contents: read
    outputs:
      mlx_url: ${{ steps.tigris.outputs.url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Apple Silicon app with embedded LFM2.5
        env:
          ZT_UI_MACOS_ZIP: dist/zt-ui-${{ needs.validate-tag.outputs.tag }}-macos-mlx.zip
        run: ./examples/ternary-bonsai/scripts/build-macos-app.sh

      - name: Upload full MLX zip to Tigris
        id: tigris
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ZT_UI_MACOS_ZIP: dist/zt-ui-${{ needs.validate-tag.outputs.tag }}-macos-mlx.zip
          TIGRIS_BUCKET: ${{ vars.TIGRIS_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "${TIGRIS_BUCKET}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::Set the TIGRIS_BUCKET variable and the TIGRIS_ACCESS_KEY_ID / TIGRIS_SECRET_ACCESS_KEY secrets. See https://www.tigrisdata.com/docs/sdks/s3/"
            exit 1
          fi
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          name="$(basename "$ZT_UI_MACOS_ZIP")"
          key="zt-ui/${{ needs.validate-tag.outputs.tag }}/${name}"
          # Object ACLs are off by default. Sending --acl public-read makes
          # CreateMultipartUpload return AccessDenied for this key.
          aws s3 cp "$ZT_UI_MACOS_ZIP" "s3://${TIGRIS_BUCKET}/${key}" \
            --endpoint-url https://t3.storage.dev \
            --content-type application/zip
          url="https://${TIGRIS_BUCKET}.t3.tigrisfiles.io/${key}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Uploaded ${url}"

      - name: Split MLX zip under the 2 GiB release limit
        env:
          ZT_UI_MACOS_ZIP: dist/zt-ui-${{ needs.validate-tag.outputs.tag }}-macos-mlx.zip
        run: |
          set -euo pipefail
          rm -rf dist/macos-mlx
          split -b 1900m "$ZT_UI_MACOS_ZIP" "${ZT_UI_MACOS_ZIP}.part-"
          rm -f "$ZT_UI_MACOS_ZIP"
          ls -lh dist/zt-ui-*-macos-mlx.zip.part-*

      - name: Upload macOS MLX app
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-mlx
          path: dist/zt-ui-*-macos-mlx.zip.part-*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - assets
      - macos
      - macos-mlx
    permissions:
      contents: write

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip *.zip.part-*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no release files" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## macOS

            Download `zt-ui-${{ needs.validate-tag.outputs.tag }}-macos.zip`, unzip, and open `zt-ui Desktop.app`.

            The app is a universal binary for macOS 13 or newer (Apple Silicon and Intel), signed with Developer ID and notarized.

            ## macOS MLX

            Apple Silicon app with [LiquidAI/LFM2.5-2.6B-MLX-bf16](https://huggingface.co/LiquidAI/LFM2.5-2.6B-MLX-bf16) embedded (MLX export of [LFM2.5-2.6B](https://huggingface.co/LiquidAI/LFM2.5-2.6B)).

            Download the full zip from Tigris: ${{ needs.macos-mlx.outputs.mlx_url }}

            GitHub release assets must be under 2 GiB, so a split copy is also attached. Reassemble, then open the app:

            ```sh
            cat zt-ui-${{ needs.validate-tag.outputs.tag }}-macos-mlx.zip.part-* > zt-ui-${{ needs.validate-tag.outputs.tag }}-macos-mlx.zip
            unzip zt-ui-${{ needs.validate-tag.outputs.tag }}-macos-mlx.zip
            open "zt-ui LFM2.5.app"
            ```
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.zip.part-*
            dist/checksums.txt

  ghcr:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - assets
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.validate-tag.outputs.image }}
          tags: |
            type=raw,value=${{ needs.validate-tag.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=zt-ui
            org.opencontainers.image.description=Zig immediate-mode dashboard reference
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
